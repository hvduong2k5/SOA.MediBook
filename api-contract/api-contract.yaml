        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 0
          description: Số trang, bắt đầu từ 0
        - in: query
          name: size
          required: false
          schema:
            type: integer
            minimum: 1
          description: Số bản ghi mỗi trang, mặc định 20, tối đa 100
        - in: query
          name: sort
          required: false
          schema:
            type: string
          description: Trường và hướng sắp xếp cho phép
        - in: query
          name: status
          required: false
          schema:
            type: string
          description: PENDING, ACTIVE, LOCKED, DISABLED
        - in: query
          name: roleCode
          required: false
