openapi: 3.1.0
info:
  title: Clinic Appointment & Real-time Queue Management API
  version: 1.0.0
  description: Implementation-oriented API contract for the 6 PostgreSQL-backed Microservices. API Gateway is an independent
    edge component and the only public entry point. Every protected operation declares x-required-permissions or x-any-of-permissions
    and x-data-scope. Wire properties use camelCase; persistence columns remain snake_case. This contract is derived from
    the six bootstrap SQL schemas and the service function specification. Some business permissions must be seeded into IAM;
    see matrix-api.md.
  contact:
    name: Project API Team
servers:
- url: http://localhost:8080
  description: Local API Gateway via Docker Compose
- url: https://api.example.com
  description: Environment placeholder; replace before deployment
tags:
- name: Identity & Access
  description: Authentication, credentials, roles, permissions and sessions.
- name: Patient profiles
  description: Administrative patient profiles and contact details.
- name: Hospital resources
  description: Hospital catalogue, doctors, rooms, specialties and working schedules.
- name: Scheduling
  description: Appointment slots, reservations, appointments, check-in and queues.
- name: Clinical records
  description: Medical encounters, diagnoses, tests, prescriptions and published records.
- name: Notifications & reminders
  description: Notifications, delivery channels, scheduled reminders and worker operations.
paths:
  /api/v1/auth/register:
    post:
      operationId: registerPatient
      summary: Đăng ký tài khoản bệnh nhân
      description: Tạo user PATIENT; sau khi tạo identity thành công, gọi Consumer Service tạo patient profile bằng saga/outbox.
        Không trả password hash.
      tags:
      - Identity & Access
      x-owner-service: Identity & Access Service
      x-required-permissions: []
      x-data-scope: PUBLIC
      x-idempotency-required: true
      x-empty-state: —
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Tạo resource thành công.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TokenPair'
                  requestId:
                    type: string
        '400':
          description: Yêu cầu sai cú pháp, query hoặc path parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Dữ liệu hợp lệ về cú pháp nhưng vi phạm validation/business rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Trùng dữ liệu, idempotency conflict hoặc trạng thái nghiệp vụ không cho phép.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Vượt rate limit; có thể kèm Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Lỗi không dự kiến trong service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Service hoặc dependency tạm thời không khả dụng.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-idempotency-key-scope: authenticated-principal-or-public-client + operationId + Idempotency-Key
      x-idempotency-replay: Same key and same request payload returns the original result; same key with different payload
        returns 409 IDEMPOTENCY_KEY_REUSED.
