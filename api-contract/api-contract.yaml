      - in: query
        name: page
        required: false
        schema:
          type: integer
          minimum: 0
        description: Số trang, bắt đầu từ 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          minimum: 1
        description: Số bản ghi mỗi trang, mặc định 20, tối đa 100
