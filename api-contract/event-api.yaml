  scheduling.appointment.rescheduled.v1:
    description: 'Routing key `scheduling.appointment.rescheduled.v1`. Publisher: Scheduling & Queue Service. Trigger: Đổi lịch đã hoàn tất; slot mới đã được giữ thành công và slot cũ được giải phóng trong giao dịch. Consumers: Reminder & Notification Service.'
