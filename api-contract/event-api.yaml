    x-consumer-queues:
      - q.notification.appointment-confirmed
    x-delivery-guarantee: at-least-once
    x-idempotency: appointmentId + eventType + aggregateVersion.
    subscribe:
      operationId: consumeAppointmentConfirmed
      summary: Consume scheduling.appointment.confirmed.v1
      description: 'Consumer queues: q.notification.appointment-confirmed. Each subscriber must use an independent durable queue for fan-out delivery.'
      message:
        $ref: '#/components/messages/AppointmentConfirmed'
      bindings:
