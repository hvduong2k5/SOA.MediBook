  scheduling.appointment.cancelled.v1:
    description: 'Routing key `scheduling.appointment.cancelled.v1`. Publisher: Scheduling & Queue Service. Trigger: Appointment chuyển sang CANCELLED và slot được giải phóng thành công. Consumers: Reminder & Notification Service.'
