asyncapi: 2.6.0
info:
  title: Clinic Appointment & Real-time Queue – Internal Event API
  version: 1.0.0
  description: Hợp đồng Event-driven nội bộ cho 6 Microservices. File này mô tả RabbitMQ topic exchange, routing keys, event envelopes và consumer queues. API Gateway là thành phần độc lập; không nằm trong broker event flow. Không gửi thông tin sức khỏe nhạy cảm, chẩn đoán, đơn thuốc hoặc PII không cần thiết trong event.
  contact:
    name: Clinic Platform Team
defaultContentType: application/json
servers:
  local:
    url: localhost:5672
    protocol: amqp
    protocolVersion: 0-9-1
    description: RabbitMQ local development; credentials lấy từ environment variables.
    security:
      - rabbitmqUserPassword: []
  docker:
    url: rabbitmq:5672
    protocol: amqp
    protocolVersion: 0-9-1
    description: RabbitMQ hostname trong Docker Compose.
    security:
      - rabbitmqUserPassword: []
channels:
  consumer.patient.profile.created.v1:
    description: 'Routing key `consumer.patient.profile.created.v1`. Publisher: Consumer Service. Trigger: Hồ sơ bệnh nhân được tạo và liên kết thành công với tài khoản IAM. Consumers: Reminder & Notification Service.'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: clinic.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
    publish:
      operationId: publishPatientProfileCreated
      summary: Publish consumer.patient.profile.created.v1
      description: Gửi thông báo chào mừng/xác nhận hồ sơ nếu chính sách bật; không gửi dữ liệu hồ sơ nhạy cảm.
      message:
        $ref: '#/components/messages/PatientProfileCreated'
      bindings:
        amqp:
          deliveryMode: 2
          mandatory: true
          timestamp: true
    x-producer-service: Consumer Service
    x-consumer-services:
      - Reminder & Notification Service
    x-consumer-queues:
      - q.notification.patient-profile-created
    x-delivery-guarantee: at-least-once
    x-idempotency: eventId; consumer lưu inbox/processed event trước khi ACK.
    subscribe:
      operationId: consumePatientProfileCreated
      summary: Consume consumer.patient.profile.created.v1
      description: 'Consumer queues: q.notification.patient-profile-created. Each subscriber must use an independent durable queue for fan-out delivery.'
      message:
        $ref: '#/components/messages/PatientProfileCreated'
      bindings:
        amqp:
          ack: true
  provider.doctor.schedule.changed.v1:
    description: 'Routing key `provider.doctor.schedule.changed.v1`. Publisher: Provider / Resource Service. Trigger: Lịch làm việc được publish, cập nhật, hủy hoặc đơn nghỉ được duyệt. Consumers: Scheduling & Queue Service.'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: clinic.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
    publish:
      operationId: publishDoctorScheduleChanged
      summary: Publish provider.doctor.schedule.changed.v1
      description: Đồng bộ thay đổi lịch nguồn lực; đánh dấu/điều chỉnh slot tương ứng và phát hiện lịch hẹn bị ảnh hưởng.
      message:
        $ref: '#/components/messages/DoctorScheduleChanged'
      bindings:
        amqp:
          deliveryMode: 2
          mandatory: true
          timestamp: true
    x-producer-service: Provider / Resource Service
    x-consumer-services:
      - Scheduling & Queue Service
    x-consumer-queues:
      - q.scheduling.doctor-schedule-changed
    x-delivery-guarantee: at-least-once
    x-idempotency: eventId + scheduleId + scheduleVersion.
    subscribe:
      operationId: consumeDoctorScheduleChanged
      summary: Consume provider.doctor.schedule.changed.v1
      description: 'Consumer queues: q.scheduling.doctor-schedule-changed. Each subscriber must use an independent durable queue for fan-out delivery.'
      message:
        $ref: '#/components/messages/DoctorScheduleChanged'
      bindings:
        amqp:
          ack: true
  scheduling.appointment.created.v1:
    description: 'Routing key `scheduling.appointment.created.v1`. Publisher: Scheduling & Queue Service. Trigger: Appointment được commit thành công sau khi giữ slot nguyên tử. Consumers: Reminder & Notification Service (Reminder Worker và Notification Handler).'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: clinic.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
    publish:
      operationId: publishAppointmentCreated
      summary: Publish scheduling.appointment.created.v1
      description: Tạo reminder job và thông báo xác nhận đặt lịch. Consumer tra thông tin liên hệ qua API có xác thực, không lấy PII từ event.
      message:
        $ref: '#/components/messages/AppointmentCreated'
      bindings:
        amqp:
          deliveryMode: 2
          mandatory: true
          timestamp: true
    x-producer-service: Scheduling & Queue Service
    x-consumer-services:
      - Reminder & Notification Service (Reminder Worker và Notification Handler)
    x-consumer-queues:
      - q.reminder.appointment-created
      - q.notification.appointment-created
    x-delivery-guarantee: at-least-once
    x-idempotency: appointmentId + eventType; reminder idempotency key theo appointmentId + reminderType + scheduledAt.
    subscribe:
      operationId: consumeAppointmentCreated
      summary: Consume scheduling.appointment.created.v1
      description: 'Consumer queues: q.reminder.appointment-created, q.notification.appointment-created. Each subscriber must use an independent durable queue for fan-out delivery.'
      message:
        $ref: '#/components/messages/AppointmentCreated'
      bindings:
        amqp:
          ack: true
